<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusMate｜學生拖延症救星</title><style>

:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#f5f7fb;--card:#fff;--fg:#334155;--muted:#64748b;--accent:#278e7c;--accent-soft:#bcebdd;--purple:#7771c9;--purple-soft:#c7c5ff;--border:#e3e8f0;--shadow:0 10px 28px rgba(53,68,91,.07)}
body.dark{--bg:#141d29;--card:#223044;--fg:#f1f6fc;--muted:#b4c1d2;--accent:#62d4b5;--accent-soft:#244d48;--purple:#b8b2ff;--purple-soft:#39395f;--border:#40516a;--shadow:0 10px 28px rgba(0,0,0,.16)}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);margin:0;line-height:1.55}
main{max-width:1100px;margin:auto;padding:30px 20px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:32px;letter-spacing:-.6px}h2{margin:0 0 18px;font-size:21px}p,.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.card{background:var(--card);padding:24px;border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow)}
.stats .card:nth-child(1){border-top:4px solid var(--accent)}.stats .card:nth-child(2){border-top:4px solid var(--purple)}.stats .card:nth-child(3){border-top:4px solid var(--accent)}
.number{font-size:32px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
button,input{font:inherit}button{border:1px solid transparent;border-radius:12px;min-height:44px;padding:10px 16px;cursor:pointer;background:var(--accent-soft);color:#164f45;transition:transform .16s,filter .16s,background .16s}
body.dark button{color:var(--fg)}button:hover:not(:disabled){filter:brightness(.96);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#fff!important}.active{background:var(--purple);color:white!important}
input[type=text]{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card);color:var(--fg);min-height:46px}
.add,.buttons{display:flex;gap:9px;flex-wrap:wrap}.add{flex-wrap:nowrap}
.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 0}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:var(--muted)}.task input{accent-color:var(--accent);width:20px;height:20px}
.task button{background:transparent;color:var(--muted);border:1px solid var(--border)}
.bar{background:var(--border);height:14px;border-radius:99px;overflow:hidden;margin:12px 0}.fill{background:linear-gradient(90deg,var(--accent),var(--purple));height:100%;width:0%;transition:width .45s ease}
.timer{font-size:clamp(54px,8vw,88px);font-weight:800;text-align:center;margin:22px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--purple)}
.center{text-align:center}.buttons{justify-content:center}.quote{margin-top:18px;text-align:center}.quote p{font-size:19px;color:var(--fg)}
#notice{min-height:30px;color:var(--accent);font-weight:700}#timerState{display:block;text-align:center;color:var(--muted);font-weight:650;margin:0 0 18px}
#progressText{font-weight:750;color:var(--accent)}#progressMessage{font-size:13px;margin:0 0 14px}
@media(max-width:768px){.grid{grid-template-columns:1fr}main{padding:20px 14px}.card{padding:18px}header{align-items:flex-start}h1{font-size:26px}.stats{gap:9px}.stats .card{padding:13px}.number{font-size:24px}}
@media(max-width:420px){header{flex-wrap:wrap}.stats .card{padding:10px;border-radius:14px}.stats .muted{font-size:12px}.number{font-size:21px}.add button{padding-inline:12px}.buttons button{flex:1}.timer{font-size:58px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}


.timer-ring{position:relative;width:min(270px,100%);aspect-ratio:1;margin:16px auto 12px;display:grid;place-items:center}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:11}
.ring-progress{fill:none;stroke:var(--purple);stroke-width:11;stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .2s}
.timer-ring.break .ring-progress{stroke:var(--accent)}
.timer-ring .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-ring .timer{font-size:clamp(43px,6vw,58px);margin:0;line-height:1.25}
.timer-ring #timerState{margin:5px 0 0}
#breakPrompt{background:var(--accent-soft);color:#164f45;padding:15px;border-radius:14px;margin:14px 0}
body.dark #breakPrompt{color:var(--fg)}
#breakPrompt[hidden]{display:none}
#breakPrompt .buttons{margin-top:10px}
@media(max-width:420px){.timer-ring{width:min(230px,100%)}}

/* v1.3 priority controls */
.task-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.task-controls label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
select{min-height:44px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--fg);font:inherit;max-width:100%}
select:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.priority-tag{flex:none!important;font-size:12px;font-weight:750;white-space:nowrap;padding:4px 9px;border-radius:99px;text-decoration:none!important}
.priority-high{background:#fee2e2;color:#991b1b!important}.priority-medium{background:#ffedd5;color:#9a3412!important}.priority-low{background:#dcfce7;color:#166534!important}
.task .task-name{flex:1;min-width:0;overflow-wrap:anywhere}.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.task{flex-wrap:wrap}.task .delete-task{margin-left:auto}
@media(max-width:560px){.task-controls{align-items:stretch;flex-direction:column}.task-controls label{justify-content:space-between}.task-controls select{flex:1;min-width:0}.task .priority-tag{font-size:11px}.task{gap:8px}}
</style></head><body><main><header><div><h1>🌱 FocusMate</h1><p id="date"></p></div><button id="theme">🌙 深色模式</button></header><section class="stats"><div class="card"><div class="muted">完成任務</div><div class="number" id="count">0/0</div></div><div class="card"><div class="muted">完成率</div><div class="number" id="percent">0%</div></div><div class="card"><div class="muted">專注次數</div><div class="number" id="sessions">0</div></div></section><div class="grid"><section class="card"><h2>📋 今日待辦</h2><form id="form" class="add"><input id="task" type="text" maxlength="120" required placeholder="新增一個學習任務" aria-label="任務名稱"><button class="primary">新增</button></form><div class="task-controls"><label for="priority">任務重要程度 <select id="priority" aria-label="新增任務優先順序"><option value="high">🔴 高優先</option><option value="medium" selected>🟠 中優先</option><option value="low">🟢 低優先</option></select></label><label for="sortOrder">任務排序 <select id="sortOrder" aria-label="任務排序方式"><option value="created">建立順序</option><option value="priority">優先順序（高 → 低）</option></select></label></div><div class="row" style="margin-top:20px"><span>學習進度</span><span id="progressText">0%</span></div><div class="bar" id="progress" role="progressbar" aria-label="學習進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div><p id="progressMessage" class="muted" aria-live="polite">新增任務，開始今天的學習吧！</p><div id="list"></div></section><section class="card"><h2>⏱️ 專注番茄鐘</h2><div class="buttons" id="modes"><button data-min="15">15 分鐘</button><button data-min="25" class="active">25 分鐘</button><button data-min="45">45 分鐘</button></div><div class="timer-ring" id="timerRing"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="ring-track" cx="110" cy="110" r="90"/><circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="90"/></svg><div class="timer-center"><div class="timer" id="clock" role="timer">25:00</div><span id="timerState" role="status">準備專注</span></div></div><div class="buttons"><button id="focusMode" class="active" type="button">🎯 專注模式</button><button id="breakMode" type="button">☕ 休息 5 分鐘</button></div><div class="buttons"><button class="primary" id="start">▶ 開始</button><button id="pause" disabled>⏸ 暫停</button><button id="reset">↻ 重設</button></div><div id="breakPrompt" hidden role="status"><strong>🎉 專注完成！休息 5 分鐘再繼續吧。</strong><div class="buttons"><button id="takeBreak" type="button" class="primary">開始休息 5 分鐘</button><button id="skipBreak" type="button">稍後再說</button></div></div><p class="center" id="notice" role="status"></p><p class="center muted">完整完成一次倒數，累積一次專注紀錄。</p></section></div><section class="card quote"><h2>✨ 給自己的鼓勵</h2><p id="quote">每一小步，都是向目標前進的一大步。</p><button id="quoteBtn">換一句鼓勵 💚</button></section><p class="center muted">資料只儲存在目前使用的瀏覽器中。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='focusmate-v1';let state={tasks:[],sessions:0,dark:false};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){state={...state,...s};if(!Array.isArray(state.tasks))state.tasks=[];if(!Number.isSafeInteger(state.sessions)||state.sessions<0)state.sessions=0}}catch{}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};$('date').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(new Date())+' · 今天也要加油！';const LEVELS={high:{text:'高優先',className:'priority-high',rank:0},medium:{text:'中優先',className:'priority-medium',rank:1},low:{text:'低優先',className:'priority-low',rank:2}};
const validPriority=p=>Object.hasOwn(LEVELS,p)?p:'medium';
state.tasks=state.tasks.filter(t=>t&&typeof t==='object'&&typeof t.name==='string').map((t,i)=>({...t,id:t.id??('legacy-'+i),done:!!t.done,priority:validPriority(t.priority)}));
state.sortOrder=state.sortOrder==='priority'?'priority':'created';$('sortOrder').value=state.sortOrder;
$('sortOrder').onchange=()=>{state.sortOrder=$('sortOrder').value==='priority'?'priority':'created';save();render()};
function render(){const list=$('list');list.replaceChildren();const tasks=state.tasks.map((t,i)=>({t,i}));if(state.sortOrder==='priority')tasks.sort((a,b)=>LEVELS[a.t.priority].rank-LEVELS[b.t.priority].rank||a.i-b.i);
tasks.forEach(({t})=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','完成 '+t.name);cb.onchange=()=>{t.done=cb.checked;save();render()};const span=document.createElement('span');span.className='task-name';span.textContent=t.name;const badge=document.createElement('span');badge.className='priority-tag '+LEVELS[t.priority].className;badge.textContent=LEVELS[t.priority].text;badge.setAttribute('aria-label','優先順序：'+LEVELS[t.priority].text);const del=document.createElement('button');del.className='delete-task';del.type='button';del.textContent='刪除';del.setAttribute('aria-label','刪除 '+t.name);del.onclick=()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()};row.append(cb,span,badge,del);list.append(row)});if(!state.tasks.length){const p=document.createElement('p');p.textContent='還沒有任務，新增第一項吧！';list.append(p)}const total=state.tasks.length,done=state.tasks.filter(x=>x.done).length,pct=total?Math.round(done/total*100):0;$('count').textContent=`${done}/${total}`;$('percent').textContent=pct+'%';$('progressText').textContent=pct+'%';$('fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('progressMessage').textContent=total?(pct===100?'🎉 所有任務都完成了！':`已完成 ${done} 項，還有 ${total-done} 項任務待完成`):'新增任務，開始今天的學習吧！';$('sessions').textContent=state.sessions}
$('form').onsubmit=e=>{e.preventDefault();const name=$('task').value.trim();if(!name)return;const id=typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now())+Math.random();state.tasks.push({id,name,done:false,priority:validPriority($('priority').value)});$('task').value='';save();render()};
function theme(){document.body.classList.toggle('dark',!!state.dark);$('theme').textContent=state.dark?'☀️ 明亮模式':'🌙 深色模式'}$('theme').onclick=()=>{state.dark=!state.dark;save();theme()};theme();render();
let selected=25,mode='focus',remaining=selected*60,endAt=0,interval=null,running=false,completed=false;
const totalSeconds=()=>mode==='break'?300:selected*60;
const fmt=()=>{const sec=Math.ceil(Math.max(0,remaining));$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');const fraction=Math.min(1,Math.max(0,remaining/totalSeconds()));$('ringProgress').style.strokeDashoffset=String(565.49*(1-fraction));};
function controls(){const total=totalSeconds();$('timerState').textContent=running?(mode==='break'?'休息倒數中':'正在專注中'):completed?(mode==='break'?'休息結束':'本輪已完成'):remaining<total?'已暫停':mode==='break'?'準備休息':'準備專注';$('start').disabled=running;$('pause').disabled=!running;$('start').textContent=remaining<total&&remaining>0?'▶ 繼續':'▶ 開始';$('timerRing').classList.toggle('break',mode==='break');$('focusMode').classList.toggle('active',mode==='focus');$('breakMode').classList.toggle('active',mode==='break');document.querySelectorAll('[data-min]').forEach(x=>{x.disabled=mode==='break';x.classList.toggle('active',mode==='focus'&&Number(x.dataset.min)===selected)});}
function stop(){if(interval!==null)clearInterval(interval);interval=null;running=false;controls()}
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=700;g.gain.value=.07;o.start();o.stop(ctx.currentTime+.25);o.onended=()=>ctx.close()}catch{}}
function tick(){if(!running)return;remaining=Math.max(0,(endAt-Date.now())/1000);fmt();if(remaining<=0){const finishedMode=mode;completed=true;stop();if(finishedMode==='focus'){state.sessions++;save();render();$('breakPrompt').hidden=false;$('notice').textContent='🎉 太棒了！完成一次專注！'}else{$('notice').textContent='☕ 休息結束，準備好再開始下一輪吧！'}beep()}}
function changeMode(next){stop();mode=next;remaining=totalSeconds();completed=false;$('breakPrompt').hidden=true;fmt();controls();$('notice').textContent=next==='break'?'休息模式已準備好':'專注模式已準備好'}
$('start').onclick=()=>{if(running)return;if(remaining<=0){remaining=totalSeconds();completed=false}endAt=Date.now()+remaining*1000;running=true;$('breakPrompt').hidden=true;$('notice').textContent=mode==='break'?'好好休息，待會再加油！':'正在專注，加油！';interval=setInterval(tick,250);fmt();controls()};
$('pause').onclick=()=>{if(!running)return;tick();if(running){stop();$('notice').textContent='已暫停，可以繼續'}};
$('reset').onclick=()=>{stop();remaining=totalSeconds();completed=false;$('breakPrompt').hidden=true;fmt();controls();$('notice').textContent='計時器已重設'};
$('modes').onclick=e=>{const b=e.target.closest('button[data-min]');if(!b||mode==='break')return;stop();selected=Number(b.dataset.min);remaining=totalSeconds();completed=false;$('breakPrompt').hidden=true;fmt();controls();$('notice').textContent='已切換專注時間'};
$('focusMode').onclick=()=>changeMode('focus');$('breakMode').onclick=()=>changeMode('break');$('takeBreak').onclick=()=>{changeMode('break');$('start').click()};$('skipBreak').onclick=()=>{$('breakPrompt').hidden=true;$('notice').textContent='記得適時休息喔！'};
const quotes=['每一小步，都是向目標前進的一大步。','開始做，比等到完美更重要。','你不需要一次完成所有事，只要先完成一件。','專注當下，未來的你會感謝現在的自己。','休息不是偷懶，是為了走得更遠。','今天多努力一點，明天就多一點選擇。'];let last=0;$('quoteBtn').onclick=()=>{let n;do{n=Math.floor(Math.random()*quotes.length)}while(n===last);last=n;$('quote').textContent=quotes[n]};fmt();controls()})();
</script></body></html>
